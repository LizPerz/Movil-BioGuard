name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: movil-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Static analysis
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unit-test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release AAB
        env:
          BIOGUARD_MOVIL_STORE_FILE: ${{ secrets.BIOGUARD_MOVIL_STORE_FILE }}
          BIOGUARD_MOVIL_STORE_PASSWORD: ${{ secrets.BIOGUARD_MOVIL_STORE_PASSWORD }}
          BIOGUARD_MOVIL_KEY_ALIAS: ${{ secrets.BIOGUARD_MOVIL_KEY_ALIAS }}
          BIOGUARD_MOVIL_KEY_PASSWORD: ${{ secrets.BIOGUARD_MOVIL_KEY_PASSWORD }}
          BIOGUARD_PAIRING_SECRET: ${{ secrets.BIOGUARD_PAIRING_SECRET }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-aab
          path: app/build/outputs/bundle/release/*.aab
